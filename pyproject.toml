[project]
name = "qr-classifier"
version = "0.1.0"
description = "Pipeline for sliding window patch generation and classification of QR codes on cars."
requires-python = "==3.11.*"
dependencies = [
    "pandas",
    "matplotlib>=3.7.0",
    "scikit-learn",
    "numpy<2.0",
    "ipywidgets",
    "jupyter",
    "jupyterlab",
    "tqdm",
    "qrcode[pil]",
    "tensorflow[and-cuda]",
    "PyYAML",
    "pydot",
    "graphviz",
    "ImageHash",
    "PyQt6",
    "pyzbar>=0.1.9",
    "opencv-contrib-python<4.10",
    "opencv-python>=4.8.0",
    "requests>=2.32.5",
    "qreader>=3.16",
    "numpy>=1.24.0",    
    "roboflow>=1.1.0",   
    "networkx",
    "pyqt6>=6.10.2",
    "python-barcode>=0.16.1",
    "faker>=37.12.0",
]
