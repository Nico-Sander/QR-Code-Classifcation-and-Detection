# Project Settings
project:
  name: "qr_classifier"
  run_name: "run_01_baseline_cnn"
  seed: 42

# Dataset Settings
data:
  dataset_path: "data/processed_patches"
  img_height: 256
  img_width: 256
  channels: 1
  batch_size: 32

# Model Architecture
model:
  input_shape: [256, 256, 1]
  type: "custom"  # Tells the parser to use the layer list below, ignoring transfer learning logic

  layers:
    # --- CNN Blocks ---
    # Block 1
    - type: "conv"
      filters: 32
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    # Block 2
    - type: "conv"
      filters: 64
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    # Block 3
    - type: "conv"
      filters: 128
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: false
    - type: "max_pool"
      pool_size: 2

    # --- Classifier Head ---
    - type: "global_avg_pool"

    - type: "dense"
      units: 128
      activation: "relu"

    - type: "dropout"
      rate: 0.5

    - type: "dense"
      units: 1
      activation: "sigmoid"

# Training Hyperparameters
# The parser uses these to compile the model
train:
  epochs: 50
  learning_rate: 0.001
  optimizer: "adam"
  loss: "binary_crossentropy"
  metrics: ["accuracy"]

  callbacks:
    early_stopping_patience: 5
    save_best_only: true