# Project Settings
project:
  name: "qr_classifier"
  run_name: "run_04_deep_cnn_augmented"
  seed: 42

# Dataset Settings
data:
  dataset_path: "data/processed_patches"
  img_height: 256
  img_width: 256
  channels: 1
  batch_size: 64    # Note: Batch size increased to 64
  validation_split: 0.2

# Model Architecture
model:
  input_shape: [256, 256, 1]
  type: "custom"  # Triggers custom layer iteration in parser

  layers:
    ### --- Data Augmentation ---
    # The parser extracts these specific types first
    
    # 1. Geometry (Spatial Robustness)
    - type: "random_flip"
      mode: "horizontal_and_vertical"
    
    - type: "random_rotation"
      factor: 0.2

    - type: "random_zoom"
      height_factor: 0.1
      width_factor: 0.1  # Note: Parser only uses height_factor in the provided code, but kept for consistency

    - type: "random_translation"
      height_factor: 0.1
      width_factor: 0.1

    # 2. Artifacts & Quality (Texture Robustness)
    - type: "gaussian_noise"
      stddev: 0.1

    - type: "random_contrast"
      factor: 0.2

    ### --- CNN Architecture ---
    # Block 1
    - type: "conv"
      filters: 32
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    # Block 2
    - type: "conv"
      filters: 64
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    # Block 3
    - type: "conv"
      filters: 128
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    # Block 4
    - type: "conv"
      filters: 128
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    # Block 5
    - type: "conv"
      filters: 128
      kernel_size: 3
      padding: "same"
      activation: "relu"
      batch_norm: true
    - type: "max_pool"
      pool_size: 2

    ### --- Classifier Head ---
    - type: "flatten"

    - type: "dense"
      units: 64
      activation: "relu"

    - type: "dropout"
      rate: 0.5

    - type: "dense"
      units: 1
      activation: "sigmoid"

# Training Hyperparameters
train:
  epochs: 50
  learning_rate: 0.0005
  optimizer: "adam"
  loss: "binary_crossentropy"
  metrics: ["accuracy"]

  callbacks:
    early_stopping_patience: 10
    save_best_only: true

    # LR Scheduler settings
    use_lr_scheduler: true
    reduce_lr_patience: 4
    reduce_lr_factor: 0.5
    reduce_lr_min: 0.000001